<svg xmlns="http://www.w3.org/2000/svg" width="60" height="48" viewBox="0 0 60 48" fill="none">
  <!-- Background soft ambient glow -->
  <circle cx="30" cy="24" r="18" fill="url(#glowGrad)" opacity="0.45" />
  
  <!-- Secondary Orbiting Confetti and Sparks -->
  <circle cx="48" cy="12" r="3" fill="#FDCB50" />
  <circle cx="12" cy="34" r="2.5" fill="#3BD5DD" />
  <circle cx="46" cy="36" r="2.2" fill="#E10021" />
  <circle cx="14" cy="14" r="2" fill="#FD8F01" />
  
  <!-- Mini 4-point Diamond Star (Top Right) -->
  <path d="M43 19 L44.5 22 L47.5 23.5 L44.5 25 L43 28 L41.5 25 L38.5 23.5 L41.5 22 Z" fill="#3BD5DD" opacity="0.9" />
  
  <!-- Mini 4-point Diamond Star (Bottom Left) -->
  <path d="M17 26 L18.2 28.5 L20.7 29.7 L18.2 30.9 L17 33.4 L15.8 30.9 L13.3 29.7 L15.8 28.5 Z" fill="#FD8F01" opacity="0.9" />

  <!-- Main 3D Celebration Star Core -->
  <g filter="url(#starShadow)">
    <!-- North Facet (Light Amber) -->
    <path d="M30 6 L30 24 L35.5 19 Z" fill="#FFE178" />
    <path d="M30 6 L24.5 19 L30 24 Z" fill="#FDCB50" />
    
    <!-- South Facet (Deep Racing Red / Crimson Warmth) -->
    <path d="M30 42 L35.5 29 L30 24 Z" fill="#E10021" />
    <path d="M30 42 L30 24 L24.5 29 Z" fill="#FD6050" />
    
    <!-- East Facet (Vibrant Coral / Gold) -->
    <path d="M48 24 L35.5 19 L30 24 Z" fill="#FD8F01" />
    <path d="M48 24 L30 24 L35.5 29 Z" fill="#FF7A00" />
    
    <!-- West Facet (Electric Cyan / Cobalt Tint) -->
    <path d="M12 24 L24.5 29 L30 24 Z" fill="#27A2CC" />
    <path d="M12 24 L30 24 L24.5 19 Z" fill="#3BD5DD" />
    
    <!-- Center Jewel Highlight -->
    <circle cx="30" cy="24" r="3.2" fill="#FFFFFF" />
  </g>

  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDCB50" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#E10021" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <filter id="starShadow" x="6" y="2" width="48" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>
</svg>